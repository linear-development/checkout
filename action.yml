name: Checkout with retry
description: >
  Drop-in checkout replacement with retry on network failures.
  Uses useblacksmith/checkout for Blacksmith git mirror cache on Blacksmith
  runners and falls back to standard clone on non-Blacksmith environments.

inputs:
  persist-credentials:
    description: Whether to configure the token with the local git config
    default: "true"
  fetch-depth:
    description: Number of commits to fetch. 0 indicates all history for all branches and tags.
    default: "1"
  ref:
    description: The branch, tag or SHA to checkout.
    default: ""
  submodules:
    description: Whether to checkout submodules (true or recursive).
    default: "false"
  sparse-checkout:
    description: Do a sparse checkout on given patterns. Each pattern should be separated with new lines.
    default: ""
  sparse-checkout-cone-mode:
    description: >
      Whether to use cone-mode when doing a sparse checkout. Set to "false" to allow
      gitignore-style include/exclude (denylist) patterns with leading slashes and "!".
    default: "true"
  filter:
    description: >
      Partially clone against a given filter (e.g. blob:none). Note: setting
      sparse-checkout already implies --filter=blob:none, so this is only needed to
      override that (e.g. tree:0) or to filter without a sparse set.
    default: ""
  token:
    description: Personal access token used to fetch the repository.
    default: ${{ github.token }}
  repository:
    description: Repository name with owner.
    default: ${{ github.repository }}

runs:
  using: composite
  steps:
    - id: attempt1
      continue-on-error: true
      uses: useblacksmith/checkout@c9796daa2a4bdebdab5bd16be2c09a70cd4e1121 # main 2026-04-28
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1000"
        GIT_HTTP_LOW_SPEED_TIME: "30"
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        submodules: ${{ inputs.submodules }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
        filter: ${{ inputs.filter }}
        token: ${{ inputs.token }}
        repository: ${{ inputs.repository }}

    - if: steps.attempt1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Checkout attempt 1 failed. Retrying in 10s..."
        sleep 10

    # A skipped step's outcome is 'skipped', so checking attempt2 == 'failure'
    # below already implies attempt1 failed.
    - id: attempt2
      if: steps.attempt1.outcome == 'failure'
      continue-on-error: true
      uses: useblacksmith/checkout@c9796daa2a4bdebdab5bd16be2c09a70cd4e1121 # main 2026-04-28
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1000"
        GIT_HTTP_LOW_SPEED_TIME: "30"
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        submodules: ${{ inputs.submodules }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
        filter: ${{ inputs.filter }}
        token: ${{ inputs.token }}
        repository: ${{ inputs.repository }}

    - if: steps.attempt2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Checkout attempt 2 failed. Final retry in 15s..."
        sleep 15

    # Final attempt: no continue-on-error, so failure here fails the step.
    - if: steps.attempt2.outcome == 'failure'
      uses: useblacksmith/checkout@c9796daa2a4bdebdab5bd16be2c09a70cd4e1121 # main 2026-04-28
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1000"
        GIT_HTTP_LOW_SPEED_TIME: "30"
      with:
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
        submodules: ${{ inputs.submodules }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
        filter: ${{ inputs.filter }}
        token: ${{ inputs.token }}
        repository: ${{ inputs.repository }}
